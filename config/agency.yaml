  - IDEA_APPROVED
  - IDEA_REJECTED
  - BUILDING
  - READY_FOR_PUBLISHER
  - READY_FOR_REVIEW
  - CHANGES_REQUESTED
  - APPROVED
  - REJECTED
  - SCHEDULED
  - PUBLISHED
  - FAILED
  - HOLD
